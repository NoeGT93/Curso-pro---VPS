solid var(--l);background:var(--p);padding:9px 10px;margin-top:5px}.cost-estimate{background:var(--p2);padding:13px 14px;margin:12px 0 7px;line-height:1.45}.danger{margin-top:26px;border-color:var(--bad);color:var(--bad)}.warn{margin:0;padding:8px 16px;background:var(--w);color:white;font-size:13px}.mobile-map{display:none}
@media(max-width:760px){.brand,.meta{display:none}.top{padding:0 9px;gap:7px}.select{max-width:130px}.layout{display:block}.rail{display:none}.mobile-map{display:inline-block}.reader{padding:27px 20px 55px}h1{font-size:25px}.snapshot{align-items:flex-start;flex-direction:column}.dash-grid,.cost-form{grid-template-columns:1fr}.quiz-summary{flex-direction:column}.quiz-status{width:100%;margin-left:0}.panel{padding:22px}}

.session-indicator{margin-left:auto;font-size:13px;color:var(--m);white-space:nowrap}.menu-trigger{min-width:42px;font-size:20px;line-height:1}.menu-list{display:grid;gap:0;margin-top:22px}.menu-action{width:100%;border:0;border-bottom:1px solid var(--l);background:transparent;color:inherit;text-align:left;padding:13px 4px;cursor:pointer;font:inherit}.menu-action:hover{background:var(--p2)}.map-session{padding:10px 0 18px;border-bottom:1px solid var(--l);margin-bottom:14px}.map-session .select{width:100%;max-width:none}#legacyNav[hidden]{display:none!important}@media(max-width:760px){.top .brand{display:block}.session-indicator{font-size:12px}.menu-panel{width:min(360px,92vw)}}

<script type="application/json" id="reglasData">__REGLAS_JSON__</script>
<script type="application/json" id="instalaData">__INSTALA_JSON__</script>
<script type="application/json" id="rielData">__RIEL_JSON__</script>
<script>__APP_JS__</script>
<script>
(()=>{
'use strict';
const T=JSON.parse(document.getElementById('textosData').textContent);
const by=id=>document.getElementById(id);
const sel=by('sessionSelect'),reader=by('reader'),menu=by('menuDialog'),settings=by('settingsDialog'),menuBtn=by('menuBtn');
const open=d=>{d.classList.add('open');d.setAttribute('aria-hidden','false')};
const close=d=>{d.classList.remove('open');d.setAttribute('aria-hidden','true')};
const closeMenu=()=>{close(menu);menuBtn.setAttribute('aria-expanded','false')};
const paint=()=>{const n=String(Number(sel?.value)||1);by('sessionIndicator').textContent=T.nav.sesionDe.replace('{n}',n);by('menuCloseCourse').hidden=n!=='20'};
const target=id=>{closeMenu();setTimeout(()=>by(id)?.click(),0)};
menuBtn.addEventListener('click',()=>{open(menu);menuBtn.setAttribute('aria-expanded','true')});
menu.querySelectorAll('[data-menu-close]').forEach(x=>x.addEventListener('click',closeMenu));
settings.querySelectorAll('[data-settings-close]').forEach(x=>x.addEventListener('click',()=>close(settings)));
by('menuProgress').onclick=()=>target('progressBtn');
by('menuLog').onclick=()=>target('workBtn');
by('menuAverias').onclick=()=>target('averiaBtn');
by('menuSearch').onclick=()=>{closeMenu();setTimeout(()=>{by('averiaBtn')?.click();setTimeout(()=>document.querySelector('[data-av-tab="search"]')?.click(),0)},0)};
by('menuMap').onclick=()=>target('openMap');
by('menuSettings').onclick=()=>{closeMenu();open(settings)};
by('settingsProfiles').onclick=()=>{close(settings);setTimeout(()=>by('profileBtn')?.click(),0)};
by('menuCloseCourse').onclick=()=>target('finalBtn');
sel?.addEventListener('change',paint);
if(reader)new MutationObserver(paint).observe(reader,{childList:true,subtree:false});
new MutationObserver(()=>{if(!menu.classList.contains('open'))menuBtn.setAttribute('aria-expanded','false')}).observe(menu,{attributes:true,attributeFilter:['class']});
paint();
})();
</script>
