<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>VPS desde cero absoluto</title>
<style>
:root{--papel:#FAFAF7;--papel-2:#F2F2ED;--tinta:#191C1A;--tinta-2:#5C615C;--linea:#DEDFD9;--pantalla:#1E2320;--pantalla-t:#D8DCD4;--hecho:#2E6B4F;--aqui:#2D5D93;--cuidado:#8A5A0B;--roto:#9C3328;--sans:ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace}
@media(prefers-color-scheme:dark){:root{--papel:#161916;--papel-2:#20241F;--tinta:#ECEFE9;--tinta-2:#ABB1A9;--linea:#343A34;--hecho:#67B18A;--aqui:#7FA9D8;--cuidado:#D6A450;--roto:#E17C70;--pantalla:#111411;--pantalla-t:#DDE2DA}}
*{box-sizing:border-box}html{background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:17px}body{margin:0;min-height:100vh;background:var(--papel)}button,select{font:inherit;color:inherit}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--aqui);outline-offset:2px}.topbar{height:62px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;background:var(--papel);z-index:20}.brand{font-weight:650;letter-spacing:-.02em;white-space:nowrap}.topbar-meta{font-size:12px;color:var(--tinta-2);white-space:nowrap}.spacer{flex:1}.session-select{max-width:240px;border:1px solid var(--linea);background:var(--papel);padding:8px 10px}.icon-btn,.text-btn{border:1px solid var(--linea);background:var(--papel);padding:8px 11px;cursor:pointer}.icon-btn:hover,.text-btn:hover{border-color:var(--tinta-2)}.icon-btn[disabled],.text-btn[disabled]{opacity:.4;cursor:not-allowed}.mobile-map{display:none}.shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:calc(100vh - 62px)}.rail{background:var(--papel-2);border-right:1px solid var(--linea);padding:22px 14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}.rail-title{font-size:12px;color:var(--tinta-2);margin:0 6px 9px}.rail-group+.rail-group{margin-top:22px}.rail-btn{display:flex;width:100%;align-items:center;gap:7px;border:0;background:transparent;text-align:left;padding:6px;border-left:3px solid transparent;cursor:pointer;font-size:14px;line-height:1.25}.rail-btn:hover{background:var(--papel)}.rail-btn.active{border-left-color:var(--aqui);font-weight:650;color:var(--aqui)}.rail-marker{width:12px;color:var(--tinta-2)}.main{min-width:0}.reader{width:min(100%,760px);margin:0 auto;padding:38px 42px 64px}.eyebrow{font-size:12px;color:var(--tinta-2);margin-bottom:7px}.session-title{font-size:27px;line-height:1.15;letter-spacing:-.035em;margin:0 0 23px;font-weight:680}.block-progress{display:flex;gap:7px;align-items:center;margin:0 0 30px}.dot{width:8px;height:8px;border:1px solid var(--tinta-2);border-radius:50%;background:transparent}.dot.done{background:var(--tinta-2)}.dot.current{background:var(--aqui);border-color:var(--aqui);width:10px;height:10px}.block-name{margin-left:5px;font-size:12px;color:var(--tinta-2)}.block-title{font-size:21px;letter-spacing:-.02em;margin:0 0 18px}.content{max-width:68ch;line-height:1.68}.content p{margin:0 0 1em}.content h3,.content h4{margin:1.55em 0 .55em;line-height:1.3}.content ul,.content ol{padding-left:1.35em}.content li{margin:.35em 0}.content blockquote{border-left:3px solid var(--linea);margin:1.2em 0;padding:.2em 0 .2em 1em;color:var(--tinta-2)}.content strong{font-weight:680}.content a{color:var(--aqui);text-underline-offset:2px}.content code:not(pre code){font-family:var(--mono);font-size:.88em;background:var(--papel-2);padding:.1em .3em}.code-wrap{position:relative;margin:1.2em 0}.code-wrap pre{margin:0;overflow:auto;font-family:var(--mono);font-size:15px;line-height:1.65;tab-size:2}.code-command pre{background:var(--pantalla);color:var(--pantalla-t);padding:18px 48px 18px 38px}.code-command pre:before{content:"$";position:absolute;left:17px;color:#8F978E;user-select:none}.copy-btn{position:absolute;right:8px;top:8px;border:1px solid #596159;background:transparent;color:var(--pantalla-t);font:12px var(--sans);padding:5px 7px;cursor:pointer}.code-output pre{background:var(--papel-2);color:var(--tinta);padding:16px 18px;border-left:3px solid var(--tinta-2)}.block-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--linea);margin-top:30px;padding-top:18px}.aside-wrap{border-top:1px solid var(--linea);margin-top:28px;padding-top:22px}.aside{margin:18px 0;background:var(--papel-2);padding:16px 18px}.aside h3{font-size:17px;margin:0 0 10px}.checks{list-style:none;padding:0;margin:0}.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linea)}.fake-check{width:17px;height:17px;border:1px solid var(--tinta-2);margin-top:5px;flex:none}.quiz-item{padding:14px 0;border-bottom:1px solid var(--linea)}.quiz-q{margin:0 0 8px}.answer{margin-top:10px;padding:12px 14px;background:var(--papel-2);font-size:14px;line-height:1.55}.answer summary{cursor:pointer;font-weight:600}.answer p{margin:.6em 0 0}.snapshot{margin:24px 0 0;border-left:3px solid var(--cuidado);padding:10px 14px;background:var(--papel-2);font-size:14px}.snapshot strong{display:block;margin-bottom:3px}.session-footer{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--linea)}.dialog{position:fixed;inset:0;z-index:50;display:none}.dialog.open{display:block}.dialog-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42)}.dialog-panel{position:absolute;top:0;right:0;width:min(560px,92vw);height:100%;overflow:auto;background:var(--papel);border-left:1px solid var(--linea);padding:28px}.dialog-close{float:right}.dialog-title{font-size:27px;letter-spacing:-.03em;margin:8px 0 22px}.dialog .content{padding-bottom:30px}.rail-mobile-panel{left:0;right:auto;width:min(320px,88vw)}.rail-mobile-panel .rail{display:block;position:static;height:auto;border:0;background:transparent;padding:10px 0}@media(max-width:720px){.topbar{padding:0 12px;gap:8px}.topbar-meta{display:none}.session-select{max-width:145px}.shell{display:block}.rail{display:none}.mobile-map{display:inline-block}.reader{padding:28px 20px 52px}.session-title{font-size:25px}.dialog-panel{padding:22px}.brand{max-width:120px;overflow:hidden;text-overflow:ellipsis}.block-nav .text-btn{padding:8px 9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar"><button class="icon-btn mobile-map" id="openMap" aria-label="Abrir mapa">Mapa</button><div class="brand">VPS desde cero</div><div class="topbar-meta" id="weekMeta"></div><div class="spacer"></div><button class="icon-btn" id="prevSession" aria-label="Sesión anterior">←</button><select class="session-select" id="sessionSelect" aria-label="Seleccionar sesión"></select><button class="icon-btn" id="nextSession" aria-label="Sesión siguiente">→</button></header>
<div class="shell"><aside class="rail" id="rail" aria-label="Mapa de las doce piezas"></aside><main class="main"><article class="reader" id="reader"></article></main></div>
<div class="dialog" id="conceptDialog" aria-hidden="true"><div class="dialog-backdrop" data-close="conceptDialog"></div><section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="conceptTitle"><button class="icon-btn dialog-close" data-close="conceptDialog">Cerrar</button><div class="eyebrow">Capítulo 0 · mapa del curso</div><h2 class="dialog-title" id="conceptTitle"></h2><div class="content" id="conceptBody"></div></section></div>
<div class="dialog" id="mapDialog" aria-hidden="true"><div class="dialog-backdrop" data-close="mapDialog"></div><section class="dialog-panel rail-mobile-panel" role="dialog" aria-modal="true" aria-label="Mapa de las doce piezas"><button class="icon-btn dialog-close" data-close="mapDialog">Cerrar</button><div class="eyebrow">Mapa del curso</div><div id="mobileRail"></div></section></div>
<script type="application/json" id="cursoData">__CURSO_JSON__</script><script type="application/json" id="reglasData">__REGLAS_JSON__</script><script type="application/json" id="instalaData">__INSTALA_JSON__</script><script type="application/json" id="rielData">__RIEL_JSON__</script>
<script>(()=>{'use strict';const curso=JSON.parse(document.getElementById('cursoData').textContent),riel=JSON.parse(document.getElementById('rielData').textContent),bloques=[['idea','Idea'],['mision','Misión'],['salidaSana','Salida sana'],['senalAlarma','Señal de alarma'],['checkpoint','Checkpoint'],['miniQuiz','Mini quiz']];let sesion=1,bloque=0;const reader=document.getElementById('reader'),select=document.getElementById('sessionSelect');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const inline=s=>{let x=escapeHTML(s);x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return x};function renderMarkdown(md){if(!md)return'';const fences=[];let src=String(md).replace(/```([^\n]*)\n([\s\S]*?)```/g,(_,lang,code)=>{const id=fences.push({lang:lang.trim().toLowerCase(),code})-1;return`\n@@FENCE${id}@@\n`});const lines=src.split(/\r?\n/);let out=[],para=[],list=null;const flushPara=()=>{if(para.length){out.push(`<p>${inline(para.join(' '))}</p>`);para=[]}},closeList=()=>{if(list){out.push(`</${list}>`);list=null}};for(const raw of lines){const line=raw.trimEnd(),fence=line.match(/^@@FENCE(\d+)@@$/);if(fence){flushPara();closeList();const f=fences[+fence[1]],isOutput=f.lang==='text',cls=isOutput?'code-output':'code-command',copy=isOutput?'':`<button class="copy-btn" type="button" data-copy="${fence[1]}">Copiar</button>`;out.push(`<div class="code-wrap ${cls}" data-fence="${fence[1]}">${copy}<pre><code>${escapeHTML(f.code.replace(/\n$/,''))}</code></pre></div>`);continue}if(!line.trim()){flushPara();closeList();continue}const h=line.match(/^(#{3,4})\s+(.+)$/);if(h){flushPara();closeList();const tag=h[1].length===3?'h3':'h4';out.push(`<${tag}>${inline(h[2])}</${tag}>`);continue}const bq=line.match(/^>\s?(.*)$/);if(bq){flushPara();closeList();out.push(`<blockquote>${inline(bq[1])}</blockquote>`);continue}const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+\.\s+(.+)$/);if(ul||ol){flushPara();const type=ul?'ul':'ol';if(list!==type){closeList();out.push(`<${type}>`);list=type}out.push(`<li>${inline((ul||ol)[1])}</li>`);continue}para.push(line.trim())}flushPara();closeList();return out.join('')}function activateCopy(scope){scope.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',()=>{const code=btn.parentElement.querySelector('code').textContent;navigator.clipboard?.writeText(code).then(()=>{btn.textContent='Copiado';setTimeout(()=>btn.textContent='Copiar',1200)}).catch(()=>fallbackCopy(code,btn))}))}function fallbackCopy(text,btn){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');btn.textContent='Copiado'}catch(_){btn.textContent='Selecciona'}finally{ta.remove();setTimeout(()=>btn.textContent='Copiar',1200)}}function railHTML(){const active=riel.capaPorSesion[String(sesion)],group=(title,items)=>`<div class="rail-group"><p class="rail-title">${title}</p>${items.map(n=>`<button class="rail-btn ${active==='*'||active===n?'active':''}" data-concept="${escapeHTML(n)}"><span class="rail-marker">${active==='*'||active===n?'▸':'·'}</span>${escapeHTML(n)}</button>`).join('')}</div>`;return group('el camino de una visita',riel.camino)+group('tu acceso',riel.acceso)}function bindRail(scope){scope.querySelectorAll('[data-concept]').forEach(b=>b.addEventListener('click',()=>openConcept(b.dataset.concept)))}function renderRail(){const html=railHTML();document.getElementById('rail').innerHTML=html;document.getElementById('mobileRail').innerHTML=`<nav class="rail">${html}</nav>`;bindRail(document.getElementById('rail'));bindRail(document.getElementById('mobileRail'))}function conceptFor(name){const piece=curso.piezas.find(p=>p.nombre===name);if(!piece)return null;return curso.capitulo0.find(c=>c.num===curso.piezas.indexOf(piece)+1)||curso.capitulo0.find(c=>c.nombre===name||c.nombre.replace(' y ','/').includes(name))}function openConcept(name){const c=conceptFor(name);if(!c)return;document.getElementById('conceptTitle').textContent=c.nombre;const body=document.getElementById('conceptBody');body.innerHTML=renderMarkdown(c.md);activateCopy(body);openDialog('conceptDialog');closeDialog('mapDialog')}function openDialog(id){const d=document.getElementById(id);d.classList.add('open');d.setAttribute('aria-hidden','false');d.querySelector('button')?.focus()}function closeDialog(id){const d=document.getElementById(id);d.classList.remove('open');d.setAttribute('aria-hidden','true')}function renderBlockContent(s,key){if(key==='checkpoint')return`<ul class="checks">${s.checkpoint.map(x=>`<li><span class="fake-check" aria-hidden="true"></span><span>${inline(x)}</span></li>`).join('')}</ul>`;if(key==='miniQuiz')return s.miniQuiz.map((q,i)=>`<div class="quiz-item"><p class="quiz-q"><strong>${i+1}.</strong> ${inline(q.pregunta)}</p><details class="answer"><summary>Ver respuesta</summary><p>${inline(q.respuesta||'Sin respuesta')}</p></details></div>`).join('');return renderMarkdown(s[key])}function render(){const s=curso.sesiones[sesion-1],[key,label]=bloques[bloque],week=curso.semanas.find(w=>w.num===s.semana);document.getElementById('weekMeta').textContent=`Semana ${s.semana} · ${week?.titulo||''}`;select.value=String(sesion);document.getElementById('prevSession').disabled=sesion===1;document.getElementById('nextSession').disabled=sesion===curso.sesiones.length;const dots=bloques.map((_,i)=>`<span class="dot ${i<bloque?'done':''} ${i===bloque?'current':''}" aria-hidden="true"></span>`).join(''),extras=s.extras?.length?`<section class="aside-wrap"><div class="eyebrow">Notas de esta sesión</div>${s.extras.map(e=>`<aside class="aside"><h3>${inline(e.titulo)}</h3><div class="content">${renderMarkdown(e.md)}</div></aside>`).join('')}</section>`:'',snap=s.snapshot?`<div class="snapshot"><strong>📸 Snapshot ${escapeHTML(s.snapshot.id)}</strong>${escapeHTML(s.snapshot.nombre)}</div>`:'';reader.innerHTML=`<div class="eyebrow">Sesión ${s.num} · semana ${s.semana}</div><h1 class="session-title">${escapeHTML(s.titulo)}</h1><div class="block-progress">${dots}<span class="block-name">${label}</span></div><section><h2 class="block-title">${label}</h2><div class="content">${renderBlockContent(s,key)}</div>${key==='mision'&&s.snapshot?snap:''}</section><nav class="block-nav"><button class="text-btn" id="prevBlock" ${bloque===0?'disabled':''}>← Anterior</button><button class="text-btn" id="nextBlock">${bloque===bloques.length-1?'Siguiente sesión →':'Siguiente →'}</button></nav>${extras}<footer class="session-footer"><button class="text-btn" id="prevSessionBottom" ${sesion===1?'disabled':''}>← Sesión anterior</button><span class="topbar-meta">${sesion} / ${curso.sesiones.length}</span><button class="text-btn" id="nextSessionBottom" ${sesion===curso.sesiones.length?'disabled':''}>Sesión siguiente →</button></footer>`;activateCopy(reader);renderRail();document.getElementById('prevBlock').onclick=()=>{if(bloque>0){bloque--;render();scrollTop()}};document.getElementById('nextBlock').onclick=()=>{if(bloque<bloques.length-1){bloque++;render()}else if(sesion<curso.sesiones.length){sesion++;bloque=0;render()}scrollTop()};document.getElementById('prevSessionBottom').onclick=()=>changeSession(-1);document.getElementById('nextSessionBottom').onclick=()=>changeSession(1)}function scrollTop(){window.scrollTo({top:0,behavior:'auto'})}function changeSession(delta){const n=Math.max(1,Math.min(curso.sesiones.length,sesion+delta));if(n!==sesion){sesion=n;bloque=0;render();scrollTop()}}curso.sesiones.forEach(s=>{const o=document.createElement('option');o.value=s.num;o.textContent=`${String(s.num).padStart(2,'0')} · ${s.titulo}`;select.appendChild(o)});select.addEventListener('change',()=>{sesion=+select.value;bloque=0;render();scrollTop()});document.getElementById('prevSession').onclick=()=>changeSession(-1);document.getElementById('nextSession').onclick=()=>changeSession(1);document.getElementById('openMap').onclick=()=>openDialog('mapDialog');document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',()=>closeDialog(x.dataset.close)));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog('conceptDialog');closeDialog('mapDialog')}});render()})();</script>
</body></html>
