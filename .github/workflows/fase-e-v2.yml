name: Ajustar fase E v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fase-e-v2.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mantener el cierre en una sola pregunta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/app.js')
          s=p.read_text(encoding='utf-8')
          old='${snapshotHTML(s)}${extrasHTML(s)}${nav}'
          new="${cierre ? '' : snapshotHTML(s)}${cierre ? '' : extrasHTML(s)}${nav}"
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'esperaba una composición snapshot/extras y encontré {n}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check build/app.js
          python3 build/construir.py
          ! grep -q '__T:' public/index.html
      - name: Publicar ajuste
        run: |
          git config user.name "SergioAguis32"
          git config user.email "sergioaguis32@gmail.com"
          git add build/app.js
          git commit -m "v2 fase E: mantener cierre de sesión enfocado"
          git push origin main
