name: Aplicar fase E v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fase-e-v2.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar fase E
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def one(src, old, new, label):
              n = src.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: esperaba 1 coincidencia y encontré {n}')
              return src.replace(old, new, 1)

          # app.js: paso 7 desde sesión 3, escritura de la bitácora y cierre de sesión.
          p = Path('build/app.js')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              '  const bloques = [[\'idea\', "__T:sesion.bloqueIdea__"], [\'mision\', "__T:sesion.bloqueMision__"], [\'salidaSana\', "__T:sesion.bloqueSalida__"], [\'senalAlarma\', "__T:sesion.bloqueAlarma__"], [\'checkpoint\', "__T:extra.app.001__"], [\'miniQuiz\', "__T:extra.app.002__"]];',
              '  const bloques = [[\'idea\', "__T:sesion.bloqueIdea__"], [\'mision\', "__T:sesion.bloqueMision__"], [\'salidaSana\', "__T:sesion.bloqueSalida__"], [\'senalAlarma\', "__T:sesion.bloqueAlarma__"], [\'checkpoint\', "__T:extra.app.001__"], [\'miniQuiz\', "__T:extra.app.002__"], [\'cierre\', "__T:sesion.bloqueCierre__"]];\n  const bloquesDe = (n) => Number(n) >= 3 ? bloques : bloques.slice(0, 6);\n  const maxBloque = (n) => bloquesDe(n).length - 1;',
              'bloques de sesión')
          s = one(s,
              "  const KEY = 'cursoVpsEstadoV3',LEGACY = 'cursoVpsEstadoV2';",
              "  const KEY = 'cursoVpsEstadoV3',LEGACY = 'cursoVpsEstadoV2',KEY_LOG = 'cursoVpsBitacoraV1';",
              'clave de bitácora')
          s = one(s,
              "  let bloque = Math.max(0, Math.min(5, Number(estado.bloque) || 0));",
              "  let bloque = Math.max(0, Math.min(maxBloque(sesion), Number(estado.bloque) || 0));",
              'límite de bloque')
          s = one(s,
              "[, bloqueNombre] = bloques[bloque]",
              "[, bloqueNombre] = bloquesDe(sesion)[Math.min(bloque, maxBloque(sesion))]",
              'bloque del panel')

          marker = "  function blockHTML(s, key) {"
          helper = r'''  function leerBitacora() {try {const x = JSON.parse(localStorage.getItem(KEY_LOG) || '[]');return Array.isArray(x) ? x : [];} catch (_) {return [];}}
          function escribirBitacora(items) {try {localStorage.setItem(KEY_LOG, JSON.stringify(items));storageOK = true;return true;} catch (_) {storageOK = false;return false;}}
          function notaCierre(n) {const items = leerBitacora(),tipo = textos.sesion.bloqueCierre;for (let i = items.length - 1; i >= 0; i--) if (Number(items[i]?.sesion) === Number(n) && items[i]?.tipo === tipo) return items[i];return null;}
          function cierreHTML(s) {const nota = notaCierre(s.num);return `<label class="session-close-field"><span>${esc(textos.sesion.cierrePregunta)}</span><textarea id="sessionCloseText" rows="6">${esc(nota?.texto || '')}</textarea><small>${esc(textos.sesion.cierreAyuda)}</small></label><div class="session-close-actions"><button class="btn" id="finishSession" type="button">${esc(textos.sesion.cierreGuardar)}</button><button class="text-btn" id="skipSession" type="button">${esc(textos.sesion.cierreSaltar)}</button></div>`;}
          function guardarCierre(s, texto) {const items = leerBitacora(),tipo = textos.sesion.bloqueCierre;let idx = -1;for (let i = items.length - 1; i >= 0; i--) if (Number(items[i]?.sesion) === Number(s.num) && items[i]?.tipo === tipo) {idx = i;break;}const entry = { fecha: new Date().toISOString(), sesion: s.num, tipo, texto };if (idx >= 0) items[idx] = { ...items[idx], ...entry };else items.push(entry);if (escribirBitacora(items)) document.dispatchEvent(new CustomEvent('curso:log-changed'));}
          function terminarSesion(s, anotar) {const texto = $('#sessionCloseText')?.value.trim() || '';if (anotar && !texto) return;if (anotar) guardarCierre(s, texto);if (sesion < curso.sesiones.length) {sesion++;bloque = 0;render();scrollTo(0, 0);return;}guardar();document.dispatchEvent(new CustomEvent('curso:open-close-course'));}
'''
          if marker not in s:
              raise SystemExit('No encuentro blockHTML')
          s = s.replace(marker, helper + marker, 1)
          s = one(s,
              "  function blockHTML(s, key) {if (key === 'checkpoint') return checkpointHTML(s);if (key === 'miniQuiz') return quizHTML(s);return renderMarkdown(s[key]);}",
              "  function blockHTML(s, key) {if (key === 'checkpoint') return checkpointHTML(s);if (key === 'miniQuiz') return quizHTML(s);if (key === 'cierre') return cierreHTML(s);return renderMarkdown(s[key]);}",
              'render de cierre')

          new_render = r'''  function render() {const s = curso.sesiones[sesion - 1],lista = bloquesDe(s.num);bloque = Math.min(bloque, lista.length - 1);const [key, label] = lista[bloque];select.value = String(sesion);const dots = lista.map((_, i) => `<span class="dot ${i < bloque ? 'done' : ''} ${i === bloque ? 'current' : ''}"></span>`).join(''),paso = textos.sesion.paso.replace('{bloque}', label).replace('{n}', String(bloque + 1)).replace('{total}', String(lista.length)),cierre = key === 'cierre',nav = cierre ? '' : `<nav class="block-nav"><button class="text-btn" id="prevBlock" ${sesion === 1 && bloque === 0 ? 'disabled' : ''}>__T:nav.anterior__</button><button class="text-btn" id="nextBlock">__T:nav.siguiente__</button></nav>`;reader.innerHTML = `<div class="eyebrow">__T:extra.app.029__ ${s.num} __T:extra.app.044__ ${s.semana}</div><h1>${esc(s.titulo)}</h1><div class="progress-row">${dots}<span>${esc(paso)}</span></div><h2>${label}</h2><div class="content">${blockHTML(s, key)}</div>${snapshotHTML(s)}${extrasHTML(s)}${nav}`;bindCopy(reader);reader.querySelectorAll('[data-cp]').forEach((x) => x.onchange = () => {estado.checkpoints[x.dataset.cp] = x.checked;x.closest('li').classList.toggle('done', x.checked);guardar();});reader.querySelectorAll('[data-quiz]').forEach((d) => d.ontoggle = () => {if (d.open && !estado.quizVistos[d.dataset.quiz]) {estado.quizVistos[d.dataset.quiz] = true;guardar();}});reader.querySelectorAll('[data-quiz-result]').forEach((b) => b.onclick = () => {const id = b.dataset.quizResult;estado.quizResultados[id] = b.dataset.value;estado.quizVistos[id] = true;guardar();const card = b.closest('[data-quiz-card]');card.classList.remove('bien', 'repasar');card.classList.add(b.dataset.value);card.querySelectorAll('[data-quiz-result]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.value === b.dataset.value)));card.querySelector('.quiz-status').textContent = quizStatus(id);const summary = reader.querySelector('.quiz-summary');if (summary) {const qs = s.miniQuiz || [],r = qs.reduce((a, _, i) => {const v = estado.quizResultados[`${s.num}:${i}`];if (v === 'bien') a.bien++;if (v === 'repasar') a.repasar++;return a;}, { bien: 0, repasar: 0 });summary.innerHTML = `<strong>${r.bien} dominadas</strong><span>${r.repasar} __T:extra.app.006__ ${qs.length - r.bien - r.repasar} __T:extra.app.007__</span>`;}});$('#markSnapshot')?.addEventListener('click', () => {estado.servidorEn = { id: s.snapshot.id, nombre: s.snapshot.nombre, sesion: s.num };guardar();render();});$('#prevBlock')?.addEventListener('click', () => moverBloque(-1));$('#nextBlock')?.addEventListener('click', () => moverBloque(1));const closeText = $('#sessionCloseText'),finish = $('#finishSession');if (closeText && finish) {const valid = () => {finish.disabled = !closeText.value.trim();};closeText.addEventListener('input', valid);finish.addEventListener('click', () => terminarSesion(s, true));valid();}$('#skipSession')?.addEventListener('click', () => terminarSesion(s, false));guardar();renderRail();document.dispatchEvent(new CustomEvent('curso:session', { detail: { session: sesion } }));setTimeout(mostrarDesbloqueo, 0);}
'''
          s, n = re.subn(r'(?m)^  function render\(\) \{.*$', new_render.rstrip('\n'), s, count=1)
          if n != 1:
              raise SystemExit(f'render: esperaba 1 coincidencia y encontré {n}')
          new_move = "  function moverBloque(d) {if (d < 0) {if (bloque > 0) bloque--;else if (sesion > 1) {sesion--;bloque = maxBloque(sesion);} else return;} else {const max = maxBloque(sesion);if (bloque < max) bloque++;else if (sesion < curso.sesiones.length) {sesion++;bloque = 0;} else return;}render();scrollTo(0, 0);}"
          s, n = re.subn(r'(?m)^  function moverBloque\(d\) \{.*$', new_move, s, count=1)
          if n != 1:
              raise SystemExit(f'moverBloque: esperaba 1 coincidencia y encontré {n}')
          p.write_text(s, encoding='utf-8')

          # fase5.js: Bitácora del menú queda solo lectura. Las herramientas previas conservan su diálogo aparte.
          p = Path('build/fase5.js')
          s = p.read_text(encoding='utf-8')
          start = "  const dlg = document.createElement('div');"
          end = "document.body.appendChild(dlg);"
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('No encuentro el diálogo de fase5')
          b += len(end)
          dialogs = r'''  const dlg = document.createElement('div');dlg.className = 'dialog';dlg.id = 'workDialog';dlg.setAttribute('aria-hidden', 'true');dlg.innerHTML = `<div class="backdrop" data-w5-close></div><section class="panel dashboard w5-panel" role="dialog" aria-modal="true" aria-labelledby="w5Title"><button class="btn close" data-w5-close>__T:nav.cerrar__</button><h2 id="w5Title">__T:extra.fase5.004__</h2><nav class="w5-tabs" aria-label="__T:extra.averia.004__"><button class="w5-tab active" data-w5-tab="snap">__T:extra.fase5.003__</button><button class="w5-tab" data-w5-tab="recover">__T:extra.fase5.004__</button><button class="w5-tab" data-w5-tab="transfer">__T:extra.fase5.005__</button></nav><section class="w5-view" data-w5-view="snap"><div class="recovery-callout"><strong>__T:extra.fase5.013__</strong>__T:extra.fase5.014__</div><div id="snapList" class="snapline"></div></section><section class="w5-view" data-w5-view="recover" hidden><div id="recoverBody"></div></section><section class="w5-view" data-w5-view="transfer" hidden><div class="export-box"><strong>__T:extra.fase5.015__</strong><p>__T:extra.fase5.016__</p><button class="btn" id="exportMd">__T:extra.fase5.017__</button></div><label class="file-pick">__T:extra.fase5.018__<input id="importFile" type="file" accept=".md,.json,text/markdown,application/json"></label><div id="importStatus" class="import-status" aria-live="polite"></div></section></section>`;document.body.appendChild(dlg);
          const logDlg = document.createElement('div');logDlg.className = 'dialog';logDlg.id = 'logDialog';logDlg.setAttribute('aria-hidden', 'true');logDlg.innerHTML = `<div class="backdrop" data-log-close></div><section class="panel dashboard" role="dialog" aria-modal="true" aria-labelledby="logArchiveTitle"><button class="btn close" data-log-close>__T:nav.cerrar__</button><h2 id="logArchiveTitle">__T:menu.bitacora__</h2><div id="logArchiveList"></div></section>`;document.body.appendChild(logDlg);'''
          s = s[:a] + dialogs + s[b:]
          s = one(s,
              "  document.addEventListener('curso:open-log', () => {if (currentSession() >= 3) open();});dlg.querySelectorAll('[data-w5-close]').forEach((x) => x.onclick = close);document.addEventListener('keydown', (e) => {if (e.key === \"__T:extra.app.052__\" && dlg.classList.contains('open')) close();});",
              "  document.addEventListener('curso:open-work', open);document.addEventListener('curso:open-log', () => {if (currentSession() >= 3) openLog();});dlg.querySelectorAll('[data-w5-close]').forEach((x) => x.onclick = close);logDlg.querySelectorAll('[data-log-close]').forEach((x) => x.onclick = closeLog);document.addEventListener('curso:log-changed', () => {if (logDlg.classList.contains('open')) renderArchive();});document.addEventListener('keydown', (e) => {if (e.key === \"__T:extra.app.052__\" && dlg.classList.contains('open')) close();if (e.key === \"__T:extra.app.052__\" && logDlg.classList.contains('open')) closeLog();});",
              'eventos de bitácora')
          old_log = re.search(r'(?m)^  function renderLog\(\) \{.*$\n  \$5\(\'#logForm\'\)\.onsubmit = .*$', s)
          if not old_log:
              raise SystemExit('No encuentro editor viejo de bitácora')
          archive = r'''  function refreshLog() {const x = read(KEY_LOG, []);log = Array.isArray(x) ? x : [];}
          function renderArchive() {refreshLog();const el = $5('#logArchiveList');if (!el) return;el.innerHTML = log.length ? [...log].reverse().map((e) => `<article class="log-item"><div class="log-head"><span>__T:extra.app.029__ ${esc5(e.sesion)} · ${esc5(fmtDate(e.fecha))}${e.tipo ? ` · ${esc5(e.tipo)}` : ''}</span></div><p>${esc5(e.texto)}</p></article>`).join('') : "<div class=\"w5-empty\">__T:extra.fase5.048__</div>";}
          function openLog() {renderArchive();logDlg.classList.add('open');logDlg.setAttribute('aria-hidden', 'false');}
          function closeLog() {logDlg.classList.remove('open');logDlg.setAttribute('aria-hidden', 'true');}'''
          s = s[:old_log.start()] + archive + s[old_log.end():]
          s = one(s,
              "  function bundle() {return { formato: 'curso-vps-backup', version: 1, exportado: new Date().toISOString(), estado: state(), averia: read(KEY_AV, {}), bitacora: log, laboratorio: lab };}",
              "  function bundle() {refreshLog();return { formato: 'curso-vps-backup', version: 1, exportado: new Date().toISOString(), estado: state(), averia: read(KEY_AV, {}), bitacora: log, laboratorio: lab };}",
              'backup con bitácora actual')
          s = one(s,
              "function renderAll() {renderLog();renderSnaps();renderRecover();}",
              "function renderAll() {refreshLog();renderSnaps();renderRecover();}",
              'render de herramientas')
          s = s.replace('.log-del{border:0;background:transparent;color:var(--bad);cursor:pointer}', '')
          if any(x in s for x in ('id="logForm"','id="logType"','id="logText"','data-log-del','data-w5-tab="log"')):
              raise SystemExit('Quedó edición vieja de bitácora en fase5.js')
          p.write_text(s, encoding='utf-8')

          # Fase 6 conserva acceso a recuperación/runbook y acepta el séptimo bloque y el nuevo tipo de nota.
          p = Path('build/fase6.js')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              "blo=Math.max(0, Math.min(5, Math.trunc(Number(x.bloque) || 0)))",
              "blo=Math.max(0, Math.min(ses >= 3 ? 6 : 5, Math.trunc(Number(x.bloque) || 0)))",
              'bloque en fase6')
          s = one(s,
              'const tipos = new Set(["__T:extra.fase5.007__", "__T:extra.fase5.008__", "__T:averias.titulo__", "__T:extra.fase5.009__", "__T:extra.fase5.004__"]);',
              'const tipos = new Set(["__T:extra.fase5.007__", "__T:extra.fase5.008__", "__T:averias.titulo__", "__T:extra.fase5.009__", "__T:extra.fase5.004__", "__T:sesion.bloqueCierre__"]);',
              'tipo cierre en fase6')
          s = one(s,
              "document.dispatchEvent(new CustomEvent('curso:open-log'));",
              "document.dispatchEvent(new CustomEvent('curso:open-work'));",
              'recuperación separada de bitácora')
          p.write_text(s, encoding='utf-8')

          # Perfiles/importación no deben truncar el séptimo bloque ni convertir Cierre en Observación.
          p = Path('build/perfiles.js')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              "bloque: Math.max(0, Math.min(5, Math.trunc(Number(x.bloque) || 0)))",
              "bloque: Math.max(0, Math.min(6, Math.trunc(Number(x.bloque) || 0)))",
              'bloque en perfiles')
          s = one(s,
              'const tipos = new Set(["__T:extra.fase5.007__", "__T:extra.fase5.008__", "__T:averias.titulo__", "__T:extra.fase5.009__", "__T:extra.fase5.004__"]);',
              'const tipos = new Set(["__T:extra.fase5.007__", "__T:extra.fase5.008__", "__T:averias.titulo__", "__T:extra.fase5.009__", "__T:extra.fase5.004__", "__T:sesion.bloqueCierre__"]);',
              'tipo cierre en perfiles')
          p.write_text(s, encoding='utf-8')

          # Copia: el contador de pasos deja de afirmar que siempre hay seis.
          p = Path('datos/textos.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['sesion']['paso'] = '{bloque} · paso {n} de {total}'
          data['extra']['fase5']['040'] = '\n- Checkpoints marcados:'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')

          # El resumen Markdown usa 6 pasos en sesiones 1-2 y 7 desde la 3.
          p = Path('build/fase5.js')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              '${Number(st.bloque || 0) + 1}__T:extra.fase5.040__',
              '${Number(st.bloque || 0) + 1}/${Number(st.sesion || 1) >= 3 ? 7 : 6}__T:extra.fase5.040__',
              'contador del backup')
          p.write_text(s, encoding='utf-8')

          # Estilo del cierre dentro del recorrido.
          p = Path('build/plantilla.html')
          s = p.read_text(encoding='utf-8')
          needle = '.block-nav{display:flex;justify-content:space-between;border-top:1px solid var(--l);margin-top:32px;padding-top:18px}'
          add = needle + '.session-close-field{display:block}.session-close-field>span{display:block;font-weight:650;margin-bottom:8px}.session-close-field textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--l);background:var(--p);color:var(--i);padding:12px;font:inherit}.session-close-field small{display:block;color:var(--m);font-size:13px;margin-top:7px}.session-close-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}'
          s = one(s, needle, add, 'estilo de cierre')
          p.write_text(s, encoding='utf-8')

          # CI permanente para que la bitácora no vuelva a salir del recorrido.
          p = Path('.github/workflows/fase-a-v2.yml')
          s = p.read_text(encoding='utf-8')
          marker = '      - name: Validar datos y build\n'
          step = r'''      - name: Validar bitácora de sesión
            run: |
              python3 - <<'PY2'
              from pathlib import Path
              import json
              app=Path('build/app.js').read_text(encoding='utf-8')
              f5=Path('build/fase5.js').read_text(encoding='utf-8')
              f6=Path('build/fase6.js').read_text(encoding='utf-8')
              perfiles=Path('build/perfiles.js').read_text(encoding='utf-8')
              textos=json.loads(Path('datos/textos.json').read_text(encoding='utf-8'))
              assert "['cierre', \"__T:sesion.bloqueCierre__\"]" in app
              assert 'Number(n) >= 3 ? bloques : bloques.slice(0, 6)' in app
              assert 'sessionCloseText' in app and 'finishSession' in app and 'skipSession' in app
              for key in ('cierrePregunta','cierreAyuda','cierreGuardar','cierreSaltar'):
                  assert f'textos.sesion.{key}' in app, key
              for old in ('id="logForm"','id="logType"','id="logText"','data-log-del','data-w5-tab="log"'):
                  assert old not in f5, old
              assert 'id = \'logDialog\'' in f5 and 'logArchiveList' in f5
              assert "curso:open-log" in f5 and "curso:open-work" in f5
              assert "curso:open-work" in f6
              assert '__T:sesion.bloqueCierre__' in f6 and '__T:sesion.bloqueCierre__' in perfiles
              assert textos['sesion']['paso'] == '{bloque} · paso {n} de {total}'
              print('session_log_step7=ok')
              print('log_menu_readonly=ok')
              print('recovery_tools_preserved=ok')
              PY2
          '''
          if marker not in s:
              raise SystemExit('No encuentro punto de inserción en CI')
          s = s.replace(marker, step + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar cambios
        run: |
          for f in build/*.js; do node --check "$f"; done
          python3 -m json.tool datos/textos.json >/dev/null
          python3 -m py_compile build/construir.py build/parse_curso.py
          count=$(grep -EIn '[áéíóúñüÁÉÍÓÚÑÜ¿¡]' build/*.js | wc -l || true)
          echo "grep_accent_lines=$count"
          test "$count" -eq 0
          python3 build/construir.py
          test -s public/index.html
          ! grep -q '__T:' public/index.html
          ! grep -q '__TEXTOS_JSON__' public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('build/app.js').read_text(encoding='utf-8')
          f5=Path('build/fase5.js').read_text(encoding='utf-8')
          f6=Path('build/fase6.js').read_text(encoding='utf-8')
          perfiles=Path('build/perfiles.js').read_text(encoding='utf-8')
          t=json.loads(Path('datos/textos.json').read_text(encoding='utf-8'))
          assert 'Number(n) >= 3 ? bloques : bloques.slice(0, 6)' in app
          assert 'sessionCloseText' in app and 'finishSession' in app and 'skipSession' in app
          assert 'logArchiveList' in f5
          assert all(x not in f5 for x in ('id="logForm"','id="logType"','id="logText"','data-log-del','data-w5-tab="log"'))
          assert "curso:open-work" in f6
          assert '__T:sesion.bloqueCierre__' in f6 and '__T:sesion.bloqueCierre__' in perfiles
          assert t['sesion']['paso'] == '{bloque} · paso {n} de {total}'
          print('FASE_E_STATIC_OK')
          PY

      - name: Publicar fase E
        run: |
          git config user.name "SergioAguis32"
          git config user.email "sergioaguis32@gmail.com"
          git rm .github/workflows/fase-e-v2.yml
          git add build/app.js build/fase5.js build/fase6.js build/perfiles.js build/plantilla.html datos/textos.json .github/workflows/fase-a-v2.yml
          git commit -m "v2 fase E: bitácora al cierre de sesión"
          git push origin main
