name: Completar fase C v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fase-c-v2-fix.yml'

permissions:
  contents: write

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reutilizar transformación ya validada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/fase-c-v2.yml').read_text(encoding='utf-8')
          a='      - name: Aplicar limpieza y desbloqueos\n        run: |\n'
          b='      - name: Validar fase C\n'
          if a not in src or b not in src:
              raise SystemExit('No encuentro la transformación temporal de fase C')
          body=src.split(a,1)[1].split(b,1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/aplicar-fase-c.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/aplicar-fase-c.sh
      - name: Validar fase C
        run: |
          for f in build/app.js build/averia.js build/fase5.js build/fase6.js build/perfiles.js; do node --check "$f"; done
          python3 -m json.tool datos/textos.json >/dev/null
          python3 build/construir.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          tpl=Path('build/plantilla.html').read_text(encoding='utf-8')
          app=Path('build/app.js').read_text(encoding='utf-8')
          av=Path('build/averia.js').read_text(encoding='utf-8')
          out=Path('public/index.html').read_text(encoding='utf-8')
          top=tpl.split('<header class="top">',1)[1].split('</header>',1)[0]
          assert len(re.findall(r'<button\b',top)) == 1, 'header_button_count != 1'
          assert not re.search(r'id\s*=\s*["\'][^"\']*legacy',tpl,re.I), 'legacy id encontrado'
          for ghost in ('legacyNav','progressBtn','prevSession','nextSession','openMap','progressBar'):
              assert ghost not in tpl and ghost not in app, ghost
          assert '__T:nav.anterior__' in app and '__T:nav.siguiente__' in app
          assert "['log',3,T.menu.bitacora]" in tpl
          assert "['averias',10,T.menu.averias]" in tpl
          assert "['close-course',20,T.menu.cierre]" in tpl
          assert 'sesion >= 6' in app
          assert 'currentA() < 19' in av
          assert '__T:' not in out and '__TEXTOS_JSON__' not in out
          print('header_button_count=1')
          print('legacy_id_hits=0')
          print('navigation_contract=ok')
          print('progressive_unlock_contract=ok')
          print('FASE_C_STATIC_OK')
          PY
      - name: Guardar fase C y retirar temporales
        run: |
          rm .github/workflows/fase-c-v2.yml .github/workflows/fase-c-v2-fix.yml
          git config user.name 'SergioAguis32'
          git config user.email 'sergioaguis32@gmail.com'
          git add build/plantilla.html build/app.js build/averia.js build/fase5.js build/fase6.js build/perfiles.js .github/workflows/fase-a-v2.yml .github/workflows/fase-c-v2.yml .github/workflows/fase-c-v2-fix.yml
          git diff --cached --check
          git commit -m 'v2 fase C: desbloqueo progresivo y navegación sin legado'
          git push origin HEAD:main
