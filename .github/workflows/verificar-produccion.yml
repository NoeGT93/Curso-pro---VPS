name: Verificar producción

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-produccion.yml'

permissions:
  contents: write

jobs:
  curl:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar dominio servido
        run: |
          curl -fsS --max-time 20 https://curso-pro-vps.vercel.app/ -o /tmp/live.html
          echo -n 'curl -s https://curso-pro-vps.vercel.app/ | grep -c "Tu regreso" => '
          grep -c 'Tu regreso' /tmp/live.html || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/live.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="application/json" id="textosData">([\s\S]*?)</script>',s)
          assert m, 'No encontré textosData en producción'
          outside=s[:m.start()]+s[m.end():]
          raw=s.count('Tu regreso')
          metadata=m.group(1).count('Tu regreso')
          live=outside.count('Tu regreso')
          menu=s.count('id="menuBtn"')
          print(f'bytes={len(s.encode("utf-8"))}')
          print(f'tu_regreso_raw={raw}')
          print(f'tu_regreso_en_textosData={metadata}')
          print(f'tu_regreso_fuera_de_textosData={live}')
          print(f'menu_button_count={menu}')
          assert raw == metadata
          assert live == 0
          assert menu >= 1
          PY
      - name: Retirar comprobación temporal
        run: |
          rm .github/workflows/verificar-produccion.yml
          git config user.name 'SergioAguis32'
          git config user.email 'sergioaguis32@gmail.com'
          git add .github/workflows/verificar-produccion.yml
          git commit -m 'chore: retirar comprobación temporal de producción [skip ci]'
          git push origin HEAD:main
