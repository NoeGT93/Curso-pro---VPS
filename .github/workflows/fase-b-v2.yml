name: Aplicar fase B v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fase-b-v2.yml'

permissions:
  contents: write

jobs:
  navegacion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar fase B
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          tpl=Path('build/plantilla.html')
          s=tpl.read_text(encoding='utf-8')

          old_header='''<header class="top">\n  <button class="btn mobile-map" id="openMap">__T:extra.plantilla.003__</button>\n  <div class="brand">__T:nav.curso__</div><div class="meta" id="weekMeta"></div><div class="spacer"></div>\n  <button class="btn" id="progressBtn" aria-label="__T:menu.progreso__">__T:extra.plantilla.001__</button>\n  <button class="btn" id="prevSession" aria-label="__T:nav.anterior__">←</button>\n  <select class="select" id="sessionSelect" aria-label="__T:extra.app.029__"></select>\n  <button class="btn" id="nextSession" aria-label="__T:nav.siguiente__">→</button>\n  <div class="bar"><span id="progressBar"></span></div>\n</header>'''
          new_header='''<header class="top">\n  <div class="brand">__T:nav.curso__</div>\n  <div class="session-indicator" id="sessionIndicator" aria-live="polite"></div>\n  <button class="btn menu-trigger" id="menuBtn" type="button" aria-label="__T:nav.menu__" aria-controls="menuDialog" aria-expanded="false">☰</button>\n</header>\n<div id="legacyNav" hidden>\n  <div id="weekMeta"></div>\n  <button id="openMap" type="button">__T:menu.mapa__</button>\n  <button id="progressBtn" type="button">__T:menu.progreso__</button>\n  <button id="prevSession" type="button">←</button>\n  <button id="nextSession" type="button">→</button>\n  <div><span id="progressBar"></span></div>\n</div>'''
          if old_header not in s:
              raise SystemExit('No encontré la barra superior esperada')
          s=s.replace(old_header,new_header,1)

          old_map='''<div class="dialog" id="mapDialog" aria-hidden="true"><div class="backdrop" data-close="mapDialog"></div><section class="panel left" role="dialog" aria-modal="true"><button class="btn close" data-close="mapDialog">__T:nav.cerrar__</button><div class="eyebrow">__T:menu.mapa__</div><div id="mobileRail"></div></section></div>'''
          new_map='''<div class="dialog" id="mapDialog" aria-hidden="true"><div class="backdrop" data-close="mapDialog"></div><section class="panel left" role="dialog" aria-modal="true"><button class="btn close" data-close="mapDialog">__T:nav.cerrar__</button><div class="eyebrow">__T:menu.mapa__</div><div class="map-session"><select class="select" id="sessionSelect" aria-label="__T:extra.app.029__"></select></div><div id="mobileRail"></div></section></div>'''
          if old_map not in s:
              raise SystemExit('No encontré el mapa esperado')
          s=s.replace(old_map,new_map,1)

          anchor='''<div class="dialog" id="progressDialog" aria-hidden="true"><div class="backdrop" data-close="progressDialog"></div><section class="panel dashboard" role="dialog" aria-modal="true" aria-labelledby="progressTitle"><button class="btn close" data-close="progressDialog">__T:nav.cerrar__</button><div class="eyebrow">__T:progreso.subtitulo__</div><h2 id="progressTitle">__T:progreso.titulo__</h2><div id="progressBody"></div><button class="btn danger" id="resetProgress">__T:extra.plantilla.005__</button></section></div>'''
          extra='''\n<div class="dialog" id="menuDialog" aria-hidden="true"><div class="backdrop" data-menu-close></div><section class="panel menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><button class="btn close" data-menu-close>__T:nav.cerrar__</button><div class="eyebrow" id="menuTitle">__T:nav.menu__</div><nav class="menu-list" aria-label="__T:nav.menu__"><button class="menu-action" id="menuProgress" type="button">__T:menu.progreso__</button><button class="menu-action" id="menuLog" type="button">__T:menu.bitacora__</button><button class="menu-action" id="menuAverias" type="button">__T:menu.averias__</button><button class="menu-action" id="menuSearch" type="button">__T:menu.buscar__</button><button class="menu-action" id="menuMap" type="button">__T:menu.mapa__</button><button class="menu-action" id="menuSettings" type="button">__T:menu.ajustes__</button><button class="menu-action" id="menuCloseCourse" type="button" hidden>__T:menu.cierre__</button></nav></section></div>\n<div class="dialog" id="settingsDialog" aria-hidden="true"><div class="backdrop" data-settings-close></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><button class="btn close" data-settings-close>__T:nav.cerrar__</button><div class="eyebrow" id="settingsTitle">__T:ajustes.titulo__</div><div class="menu-list"><button class="menu-action" id="settingsProfiles" type="button">__T:ajustes.perfiles__</button></div></section></div>'''
          if anchor not in s:
              raise SystemExit('No encontré el panel de progreso esperado')
          s=s.replace(anchor,anchor+extra,1)

          css='''\n.session-indicator{margin-left:auto;font-size:13px;color:var(--m);white-space:nowrap}.menu-trigger{min-width:42px;font-size:20px;line-height:1}.menu-list{display:grid;gap:0;margin-top:22px}.menu-action{width:100%;border:0;border-bottom:1px solid var(--l);background:transparent;color:inherit;text-align:left;padding:13px 4px;cursor:pointer;font:inherit}.menu-action:hover{background:var(--p2)}.map-session{padding:10px 0 18px;border-bottom:1px solid var(--l);margin-bottom:14px}.map-session .select{width:100%;max-width:none}#legacyNav[hidden]{display:none!important}@media(max-width:760px){.top .brand{display:block}.session-indicator{font-size:12px}.menu-panel{width:min(360px,92vw)}}\n'''
          if '.session-indicator{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          nav_script='''\n<script>\n(()=>{\n'use strict';\nconst T=JSON.parse(document.getElementById('textosData').textContent);\nconst by=id=>document.getElementById(id);\nconst sel=by('sessionSelect'),reader=by('reader'),menu=by('menuDialog'),settings=by('settingsDialog'),menuBtn=by('menuBtn');\nconst open=d=>{d.classList.add('open');d.setAttribute('aria-hidden','false')};\nconst close=d=>{d.classList.remove('open');d.setAttribute('aria-hidden','true')};\nconst closeMenu=()=>{close(menu);menuBtn.setAttribute('aria-expanded','false')};\nconst paint=()=>{const n=String(Number(sel?.value)||1);by('sessionIndicator').textContent=T.nav.sesionDe.replace('{n}',n);by('menuCloseCourse').hidden=n!=='20'};\nconst target=id=>{closeMenu();setTimeout(()=>by(id)?.click(),0)};\nmenuBtn.addEventListener('click',()=>{open(menu);menuBtn.setAttribute('aria-expanded','true')});\nmenu.querySelectorAll('[data-menu-close]').forEach(x=>x.addEventListener('click',closeMenu));\nsettings.querySelectorAll('[data-settings-close]').forEach(x=>x.addEventListener('click',()=>close(settings)));\nby('menuProgress').onclick=()=>target('progressBtn');\nby('menuLog').onclick=()=>target('workBtn');\nby('menuAverias').onclick=()=>target('averiaBtn');\nby('menuSearch').onclick=()=>{closeMenu();setTimeout(()=>{by('averiaBtn')?.click();setTimeout(()=>document.querySelector('[data-av-tab="search"]')?.click(),0)},0)};\nby('menuMap').onclick=()=>target('openMap');\nby('menuSettings').onclick=()=>{closeMenu();open(settings)};\nby('settingsProfiles').onclick=()=>{close(settings);setTimeout(()=>by('profileBtn')?.click(),0)};\nby('menuCloseCourse').onclick=()=>target('finalBtn');\nsel?.addEventListener('change',paint);\nif(reader)new MutationObserver(paint).observe(reader,{childList:true,subtree:false});\nnew MutationObserver(()=>{if(!menu.classList.contains('open'))menuBtn.setAttribute('aria-expanded','false')}).observe(menu,{attributes:true,attributeFilter:['class']});\npaint();\n})();\n</script>'''
          marker='<script>__APP_JS__</script>'
          if marker not in s:
              raise SystemExit('No encontré __APP_JS__')
          if "const T=JSON.parse(document.getElementById('textosData').textContent);" not in s:
              s=s.replace(marker,marker+nav_script,1)

          tpl.write_text(s,encoding='utf-8')

          p=Path('datos/textos.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for k in ('045','046','047','048'):
              data['extra']['app'][k]='Anterior' if k=='045' else 'Siguiente'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          PY
      - name: Validar fase B
        run: |
          for f in build/app.js build/averia.js build/fase5.js build/fase6.js build/perfiles.js; do node --check "$f"; done
          python3 -m json.tool datos/textos.json >/dev/null
          python3 build/construir.py
          test -s public/index.html
          ! grep -q '__T:' public/index.html
          ! grep -q '__TEXTOS_JSON__' public/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build/plantilla.html').read_text(encoding='utf-8')
          top=s.split('<header class="top">',1)[1].split('</header>',1)[0]
          assert 'sessionSelect' not in top
          assert 'progressBtn' not in top
          assert 'prevSession' not in top
          assert 'nextSession' not in top
          assert 'sessionIndicator' in top and 'menuBtn' in top
          assert '<select class="select" id="sessionSelect"' in s.split('id="mapDialog"',1)[1]
          assert 'id="menuProgress"' in s and 'id="menuSettings"' in s and 'id="menuCloseCourse"' in s
          print('FASE_B_DOM_OK')
          PY
      - name: Guardar y retirar herramienta temporal
        run: |
          rm .github/workflows/fase-b-v2.yml
          git config user.name 'SergioAguis32'
          git config user.email 'sergioaguis32@gmail.com'
          git add build/plantilla.html datos/textos.json .github/workflows/fase-b-v2.yml
          git diff --cached --check
          git commit -m 'v2 fase B: simplificar navegación'
          git push origin HEAD:main
