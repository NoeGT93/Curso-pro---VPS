name: Verificar interfaz v2

on:
  push:
    branches: [main]
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'build/parse_curso.py'
      - 'contenido/CURSO_VPS_v3.md'
      - 'datos/curso_partes/**'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'
  pull_request:
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'build/parse_curso.py'
      - 'contenido/CURSO_VPS_v3.md'
      - 'datos/curso_partes/**'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          for f in build/*.js; do node --check "$f"; done
      - name: Comprobar copia residual
        run: |
          count=$(grep -EIn '[áéíóúñüÁÉÍÓÚÑÜ¿¡]' build/*.js | wc -l || true)
          echo "grep_accent_lines=$count"
          test "$count" -eq 0
          ! grep -EIn '__T:[A-Za-z0-9_.-]+__[[:space:]]+(absoluto|pantalla|anterior|siguiente)' build/plantilla.html
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path('datos/textos.json').read_text(encoding='utf-8'))
          forbidden=[k for k in data.get('_renombres',{}) if not k.startswith('_')]
          hits=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if path=='' and k=='_renombres':
                          continue
                      walk(v,f'{path}.{k}' if path else k)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              elif isinstance(x,str):
                  for old in forbidden:
                      if old in x:
                          hits.append((path,old,x))
          walk(data)
          if hits:
              for path,old,value in hits:
                  print(f'PROHIBIDO {old!r} en {path}: {value!r}')
              sys.exit(1)
          print('forbidden_text_hits=0')
          PY
      - name: Validar navegación y desbloqueos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          tpl=Path('build/plantilla.html').read_text(encoding='utf-8')
          app=Path('build/app.js').read_text(encoding='utf-8')
          av=Path('build/averia.js').read_text(encoding='utf-8')
          textos=json.loads(Path('datos/textos.json').read_text(encoding='utf-8'))
          top=tpl.split('<header class="top">',1)[1].split('</header>',1)[0]
          assert top.count('<div class="brand">') == 1
          assert 'id="sessionIndicator"' in top
          assert 'id="menuBtn"' in top
          assert len(re.findall(r'<button\b',top)) == 1, 'el encabezado debe tener un solo botón'
          fuentes=[tpl]+[p.read_text(encoding='utf-8') for p in sorted(Path('build').glob('*.js'))]
          patron_id_legacy=re.compile(r'\bid\s*=\s*\\?["\'][^"\']*legacy',re.I)
          assert not any(patron_id_legacy.search(x) for x in fuentes), 'no se permiten elementos con id legacy'
          for ghost in ('legacyNav','progressBtn','prevSession','nextSession','openMap','progressBar'):
              assert ghost not in tpl and ghost not in app, ghost
          map_part=tpl.split('id="mapDialog"',1)[1].split('</section></div>',1)[0]
          assert 'id="sessionSelect"' in map_part
          assert 'id="menuList"' in tpl
          assert '__T:nav.anterior__' in app and '__T:nav.siguiente__' in app
          assert "['log',3,T.menu.bitacora]" in tpl
          assert "['averias',10,T.menu.averias]" in tpl
          assert "['close-course',20,T.menu.cierre]" in tpl
          assert 'sesion >= 6' in app
          assert 'currentA() < 10' in av, 'el cronómetro debe pertenecer a averías desde sesión 10'
          assert 'currentA() < 19' not in av, 'la sesión 19 no controla el montaje del cronómetro'
          m=re.search(r'const DESBLOQUEOS\s*=\s*\[(.*?)\];',app,re.S)
          assert m, 'falta DESBLOQUEOS'
          claves=re.findall(r"\['([^']+)'\s*,\s*\d+\]",m.group(1))
          faltan=[k for k in claves if not isinstance(textos.get('desbloqueo',{}).get(k),dict)]
          assert not faltan, f'desbloqueos sin copia: {faltan}'
          assert "['cierre', 20]" in app
          print('navigation_contract=ok')
          print('legacy_id_hits=0')
          print('header_button_count=1')
          print('unlock_copy_contract=ok')
          print('timer_with_averias=ok')
          print('progressive_unlock_contract=ok')
          PY
      - name: Validar entrada
        run: |
          python3 build/parse_curso.py contenido/CURSO_VPS_v3.md /tmp/curso-ci.json >/tmp/parse-curso.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('build/app.js').read_text(encoding='utf-8')
          entrada=Path('build/entrada.js').read_text(encoding='utf-8')
          builder=Path('build/construir.py').read_text(encoding='utf-8')
          curso=json.loads(Path('/tmp/curso-ci.json').read_text(encoding='utf-8'))
          mision=curso['sesiones'][0]['mision']
          anchors=('Mac','Linux','Windows','Paso 2')
          missing=[x for x in anchors if x not in mision]
          assert not missing, f'sesión 1 perdió anclas de SO: {missing}'
          assert "entrada: { completa: false, paso: 0, nombre: '', so: '' }" in app
          assert 'window.cursoVpsSetEntrada' in app
          assert 'cursoE.semanas' in entrada and 'cursoE.piezas' in entrada
          assert "Number(st.sesion)!==1||Number(st.bloque)!==1" in entrada
          assert 'session1_os_branch_anchors_missing' in entrada
          assert 'for p in (ENTRADA,AVERIA,FASE5,FASE6,PERFILES)' in builder
          print('entry_three_steps=ok')
          print('entry_state_persisted=ok')
          print('session1_os_branch=ok')
          print('session1_os_anchor_contract=ok')
          PY
      - name: Validar datos y build
        run: |
          python3 -m json.tool datos/textos.json >/dev/null
          python3 -m py_compile build/construir.py build/parse_curso.py
          python3 build/construir.py
          test -s public/index.html
          ! grep -q '__T:' public/index.html
          ! grep -q '__TEXTOS_JSON__' public/index.html
