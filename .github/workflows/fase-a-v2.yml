name: Verificar copia de interfaz

on:
  push:
    branches: [main]
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'
  pull_request:
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          for f in build/app.js build/averia.js build/fase5.js build/fase6.js build/perfiles.js; do
            node --check "$f"
          done
      - name: Comprobar copia residual
        run: |
          count=$(grep -EIn '[áéíóúñüÁÉÍÓÚÑÜ¿¡]' build/*.js | wc -l || true)
          echo "grep_accent_lines=$count"
          test "$count" -eq 0
          ! grep -EIn 'Regreso|Tu regreso|Fase final|Bitácora y recuperación|Autocorrector|Modo Avería' build/*.js
      - name: Validar datos y build
        run: |
          python3 -m json.tool datos/textos.json >/dev/null
          python3 -m py_compile build/construir.py build/parse_curso.py
          python3 build/construir.py
          test -s public/index.html
          ! grep -q '__T:' public/index.html
          ! grep -q '__TEXTOS_JSON__' public/index.html
