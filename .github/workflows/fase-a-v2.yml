name: Verificar interfaz v2

on:
  push:
    branches: [main]
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'
  pull_request:
    paths:
      - 'build/*.js'
      - 'build/plantilla.html'
      - 'build/construir.py'
      - 'datos/textos.json'
      - '.github/workflows/fase-a-v2.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          for f in build/app.js build/averia.js build/fase5.js build/fase6.js build/perfiles.js; do node --check "$f"; done
      - name: Comprobar copia residual
        run: |
          count=$(grep -EIn '[áéíóúñüÁÉÍÓÚÑÜ¿¡]' build/*.js | wc -l || true)
          echo "grep_accent_lines=$count"
          test "$count" -eq 0
          ! grep -EIn '__T:[A-Za-z0-9_.-]+__[[:space:]]+(absoluto|pantalla|anterior|siguiente)' build/plantilla.html
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path('datos/textos.json').read_text(encoding='utf-8'))
          forbidden=[k for k in data.get('_renombres',{}) if not k.startswith('_')]
          hits=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if path=='' and k=='_renombres':
                          continue
                      walk(v,f'{path}.{k}' if path else k)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              elif isinstance(x,str):
                  for old in forbidden:
                      if old in x:
                          hits.append((path,old,x))
          walk(data)
          if hits:
              for path,old,value in hits:
                  print(f'PROHIBIDO {old!r} en {path}: {value!r}')
              sys.exit(1)
          print('forbidden_text_hits=0')
          PY
      - name: Validar navegación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('build/plantilla.html').read_text(encoding='utf-8')
          top=s.split('<header class="top">',1)[1].split('</header>',1)[0]
          assert top.count('<div class="brand">') == 1
          assert 'id="sessionIndicator"' in top
          assert 'id="menuBtn"' in top
          for forbidden in ('sessionSelect','progressBtn','prevSession','nextSession','openMap'):
              assert forbidden not in top, forbidden
          map_part=s.split('id="mapDialog"',1)[1].split('</section></div>',1)[0]
          assert 'id="sessionSelect"' in map_part
          for item in ('menuProgress','menuLog','menuAverias','menuSearch','menuMap','menuSettings','menuCloseCourse'):
              assert f'id="{item}"' in s, item
          assert 'id="menuCloseCourse" type="button" hidden' in s
          print('navigation_contract=ok')
          PY
      - name: Validar datos y build
        run: |
          python3 -m json.tool datos/textos.json >/dev/null
          python3 -m py_compile build/construir.py build/parse_curso.py
          python3 build/construir.py
          test -s public/index.html
          ! grep -q '__T:' public/index.html
          ! grep -q '__TEXTOS_JSON__' public/index.html
